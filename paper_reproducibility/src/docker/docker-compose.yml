version: '3.8'

services:
  ros2_workspace:
    build:
      context: ../src
      dockerfile: ../docker/Dockerfile
    image: ros2_colcon_workspace:humble
    container_name: ros2_moveit_container
    privileged: true
    network_mode: host
    
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_SOFTWARE=1
      - ROS_DOMAIN_ID=42
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    
    volumes:
      # Mount src directory for live development
      - ../src:/root/colcon_ws/src:rw
      # X11 socket for GUI
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # GPU access (if available)
      - /dev/dri:/dev/dri
    
    stdin_open: true
    tty: true
    
    command: bash
